
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Sari-Sari Cashier</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  padding: 15px;
  text-align: center;
}
h1 { color: #176b45; }
button {
  padding: 15px;
  margin: 5px;
  border: none;
  border-radius: 10px;
  background: #176b45;
  color: white;
  font-size: 16px;
}
.total {
  font-size: 32px;
  font-weight: bold;
  margin: 20px;
}
input {
  padding: 12px;
  font-size: 18px;
  width: 80%;
}
</style>
</head>

<body>

<h1>Smart Sari-Sari Cashier</h1>
<p>Tap a product to add it.</p>

<button onclick="addItem(10)">Milo ₱10</button>
<button onclick="addItem(16)">Lucky Me ₱16</button>
<button onclick="addItem(8)">Coffee ₱8</button>

<div class="total">
  Total: ₱<span id="total">0.00</span>
</div>

<p>Customer Payment</p>
<input type="number" id="payment"
       placeholder="Enter payment"
       oninput="calculateChange()">

<h2>Change: ₱<span id="change">0.00</span></h2>

<button onclick="newCustomer()">New Customer</button>

<script>
let total = 0;

function addItem(price) {
  total += price;
  document.getElementById("total").innerText =
    total.toFixed(2);
  calculateChange();
}

function calculateChange() {
  const payment =
    Number(document.getElementById("payment").value);

  const change = payment - total;

  document.getElementById("change").innerText =
    Math.max(0, change).toFixed(2);
}

function newCustomer() {
  total = 0;
  document.getElementById("total").innerText = "0.00";
  document.getElementById("payment").value = "";
  document.getElementById("change").innerText = "0.00";
}
</script>

</body>
</html>
